# Draft of the F-Droid build recipe (fdroiddata: metadata/io.github.yoldaskelbow.amplatypus.yml).
# Fill in `commit` and `AllowedAPKSigningKeys` for the release being submitted. See docs/FDROID.md.
Categories:
  - Multimedia
License: GPL-3.0-or-later
AuthorName: YoldasKelboW
SourceCode: https://github.com/YoldasKelboW/amplatypus
IssueTracker: https://github.com/YoldasKelboW/amplatypus/issues
Changelog: https://github.com/YoldasKelboW/amplatypus/blob/HEAD/CHANGELOG.md

AutoName: AMPlatypus

RepoType: git
Repo: https://github.com/YoldasKelboW/amplatypus.git
# Reproducible build: F-Droid builds the free APK itself, compares it with ours and, if they match,
# ships ours with the developer signature.
Binaries: https://github.com/YoldasKelboW/amplatypus/releases/download/v%v/amplatypus-%v-free.apk

Builds:
  - versionName: 1.0.0
    versionCode: 100
    commit: v1.0.0
    subdir: app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y -t trixie openjdk-21-jdk-headless
      - update-alternatives --auto java
    gradle:
      - free
    prebuild: sdkmanager 'cmake;4.1.2' 'platforms;android-37.2' 'build-tools;37.0.0'
    ndk: 30.0.16248370

AllowedAPKSigningKeys: d41349423770350460bc1c519428ae503655d1a239071e1ee1f51b5abb671fb3

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
UpdateCheckData: app/build.gradle.kts|versionCode\s*=\s*(\d+)|.|versionName\s*=\s*"([^"]+)"
CurrentVersion: 1.0.0
CurrentVersionCode: 100
