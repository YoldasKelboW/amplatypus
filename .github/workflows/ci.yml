name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The project's own Gradle wrapper is checked before the submodules arrive: some of them (ZXTune)
      # bring Gradle projects of their own whose wrappers are unknown to the check. They are never run;
      # only C and C++ sources are taken from them.
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - name: Check out submodules
        run: git submodule update --init --recursive --depth=1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
      - name: Lint, unit tests and debug APK
        run: ./gradlew lintFullDebug testFreeDebugUnitTest testFullDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: amplatypus-debug-apk
          path: app/build/outputs/apk/*/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/lint-results-fullDebug.html
            app/build/reports/tests/
